<title id="verification-pipeline-title">From pasted text to a credibility report</title>
<desc id="verification-pipeline-desc">Seven steps: paste text, extract claims with a language model, locate each quote in the text with code, retrieve evidence with Tavily, judge the claim with a language model, validate citations with code, and show the credibility report. Code rejects quotes that are not in the text and citations that are not in a retrieved source.</desc>

<rect x="544" y="284" width="384" height="56" rx="8" fill="#faf8f4" stroke="#d5cfc3" stroke-width="1" stroke-dasharray="4 4"/><text x="736.0" y="308.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#10223d" text-anchor="middle">An excerpt that is not in the retrieved source</text><text x="736.0" y="326.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#4b6178" text-anchor="middle">citation dropped · no confirmed citation → Unverified</text>
