<style>

<title id="verification-sequence-title">One check, message by message</title>
<desc id="verification-sequence-desc">The user pastes text and the page posts it to the check route. The route asks the language model for claims, locates the quotes, and streams a claims event. For each claim it searches Tavily, asks the language model for a verdict, validates the citations in code, and streams a verdict event. A done event ends the stream. Selecting a highlight needs no server call.</desc>

<text x="492" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#4b6178" text-anchor="start">validate citations (code)</text>
