<title id="verdict-decision-flow-title">How a claim gets its status</title>
<desc id="verdict-decision-flow-desc">A model verdict is accepted only after code confirms its citations. If the search or the model fails, no sources are found, the model says unverified, no confirmed citation from a primary or secondary source backs the status, or a confirmed reputable source says the opposite, the claim is Unverified. Otherwise it is Supported or Contradicted.</desc>
