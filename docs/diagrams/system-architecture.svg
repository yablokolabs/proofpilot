<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-architecture-title system-architecture-desc" id="system-architecture-root">
<title id="system-architecture-title">One Next.js app, two external services</title>
<desc id="system-architecture-desc">The browser page sends text to one server route. The route extracts claims with a language model, locates them in the text with code, retrieves evidence with Tavily, judges each claim with the language model, validates citations with code, and streams events back. Nothing is stored.</desc>
